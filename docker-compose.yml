services:
  redis:
    image: redis:7-alpine
    container_name: ride-booking-redis

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: DockerFile
    container_name: ride-booking-backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
    ports:
      - "5001:5000"
    restart: unless-stopped